description: Hynitron CST820 touchscreen sensor

compatible: "hynitron,cst820"

include: i2c-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description: |
      Interrupt GPIO. Used by the controller to signal touch data is
      available. Active low falling edge.

  rst-gpios:
    type: phandle-array
    required: true
    description: |
      Reset GPIO. Used by the controller to reset the sensor.

  pwr-gpios:
    type: phandle-array
    required: false
    description: |
      Optional power enable GPIO for the sensor supply rail. Asserted before
      the reset sequence so the sensor is powered when its registers are
      first accessed. Omit on boards where the rail is always on.

  pwr-en-gpios:
    type: phandle-array
    required: false
    description: |
      Optional main supply enable GPIO, asserted before pwr-gpios. On boards
      where the sensor sits behind a board-level rail (shared with other
      peripherals) this is that rail's enable. Omit when the rail is always on
      or enabled elsewhere.
  

  gesture-release-timeout-ms:
    type: int
    default: 30
    description: |
      Timeout in milliseconds after which a touch gesture is considered released.
