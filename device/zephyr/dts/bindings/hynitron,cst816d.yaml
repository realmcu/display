description: Hynitron CST816D touchscreen sensor

compatible: "hynitron,cst816d"

include: i2c-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description: |
      Interrupt GPIO. Used by the controller to signal touch data is
      available. Active low falling edge.

  rst-gpios:
    type: phandle-array
    required: true
    description: |
      Reset GPIO. Used by the controller to reset the sensor.

  gesture-release-timeout-ms:
    type: int
    default: 30
    description: |
      Timeout in milliseconds after which a touch gesture is considered released.
