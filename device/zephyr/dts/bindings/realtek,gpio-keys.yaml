description: |
  Zephyr Input GPIO KEYS parent node

  This defines a group of buttons that can generate input events. Each button
  is defined in a child node of the gpio-keys node and defines a specific key
  code.

  For example:

  / {
      gpio_keys: gpio_keys{
          compatible = "realtek,gpio-keys";
          debounce-interval-ms = <30>;
          key1: key1{
              gpios = <KEY1_GPIO_PIN (GPIO_ACTIVE_HIGH | GPIO_PULL_UP)>;
              label = "key1";
              key,id = <100>;
              status = "okay";
          };
      };
  };

compatible: "realtek,gpio-keys"

include: base.yaml

properties:
  debounce-interval-ms:
    type: int
    default: 30
    description: |
       Debouncing interval time in milliseconds.
       If not specified defaults to 30.

child-binding:
  description: GPIO KEYS child node
  properties:
    gpios:
      type: phandle-array
      required: true

    label:
      type: string
      description: Descriptive name of the key

    key,id:
      type: int
      description: Key code to emit.
      required: true


